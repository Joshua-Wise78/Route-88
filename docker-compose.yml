services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: route88
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

  api:
    build: .
    container_name: route88_api
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file:
      - .env
    depends_on:
      - postgres

  osrm:
    image: osrm/osrm-backend
    container_name: osrm_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: "osrm-routed --algorithm mld /data/ohio-latest.osrm"

volumes:
  postgres_data:
