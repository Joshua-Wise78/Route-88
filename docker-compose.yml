services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-route88}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-route88}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    profiles:
      - tools
      - all

  api:
    build: .
    container_name: route88_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3333}:3333"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  osrm:
    image: osrm/osrm-backend
    container_name: osrm_backend
    restart: unless-stopped
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./osrm-data:/data
    command: "osrm-routed --algorithm mld /data/ohio-latest.osrm"
    profiles:
      - routing
      - all

  nominatim:
    image: mediagis/nominatim:4.4
    container_name: nominatim_backend
    restart: unless-stopped
    ports:
      - "${NOMINATIM_PORT:-8082}:8080"
    environment:
      - PBF_URL=${NOMINATIM_PBF_URL:-https://download.geofabrik.de/north-america/us/ohio-latest.osm.pbf}
      - REPLICATION_URL=${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/north-america/us/ohio-updates/}
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
      - nominatim_flatnode:/nominatim/flatnode
    shm_size: 2gb
    profiles:
      - routing
      - all

volumes:
  postgres_data:
  nominatim_data:
  nominatim_flatnode:
