services:
  db:
    image: postgres:16-alpine
    container_name: route88-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: route88_user
      POSTGRES_PASSWORD: route88_password
      POSTGRES_DB: route88_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: route88-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: "postgres://route88_user:route88_password@db:5432/route88_db?sslmode=disable"
      OHGO_API_KEY: "${OHGO_API_KEY}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
    depends_on:
      - db

volumes:
  pgdata:
