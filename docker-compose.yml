services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: route88
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

  api:
    build: .
    container_name: route88_api
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file:
      - .env
    depends_on:
      - postgres

  osrm:
    image: osrm/osrm-backend
    container_name: osrm_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: "osrm-routed --algorithm mld /data/ohio-latest.osrm"

  nominatim:
    image: mediagis/nominatim:4.4
    container_name: nominatim_backend
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - PBF_URL=https://download.geofabrik.de/north-america/us/ohio-latest.osm.pbf
      - REPLICATION_URL=https://download.geofabrik.de/north-america/us/ohio-updates/
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
      - nominatim_flatnode:/nominatim/flatnode
    shm_size: 2gb

volumes:
  postgres_data:
  nominatim_data:
  nominatim_flatnode:
