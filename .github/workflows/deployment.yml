name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and pull code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # Update this path to match where the project is located on your server
            cd /mnt/appdata/stacks/route88

            git pull origin main
            
            # Since this project uses Docker Compose, you likely need to rebuild and restart your services:
            docker compose up -d --build
